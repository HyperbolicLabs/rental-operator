apiVersion: compute.hyperbolic.ai/v1alpha1
kind: ProviderConfig
metadata:
  name: default
  namespace: default
spec:
  # References a Secret in this namespace holding your Hyperbolic API key.
  # Create it with:
  #   kubectl create secret generic hyperbolic-key \
  #     --from-literal=api-key=sk_live_xxxxxxxxxxxxxxxxxxxx
  #   kubectl label secret hyperbolic-key compute.hyperbolic.ai/credentials=true
  # The operator only reads Secrets with that label.
  credentials:
    source: Secret
    secretRef:
      name: hyperbolic-key
      key: api-key
  # endpoint defaults to https://api.hyperbolic.ai
  # endpoint: https://api.hyperbolic.ai
