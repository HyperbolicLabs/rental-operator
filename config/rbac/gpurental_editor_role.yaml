# This rule is not used by the project hyperbolic-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the hyperbolic.ai.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: hyperbolic-operator
    app.kubernetes.io/managed-by: kustomize
  name: gpurental-editor-role
rules:
- apiGroups:
  - hyperbolic.ai
  resources:
  - gpurentals
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - hyperbolic.ai
  resources:
  - gpurentals/status
  verbs:
  - get
