# This rule is not used by the project rental-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to compute.hyperbolic.ai resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: rental-operator
    app.kubernetes.io/managed-by: kustomize
  name: gpuavailability-viewer-role
rules:
- apiGroups:
  - compute.hyperbolic.ai
  resources:
  - gpuavailabilities
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - compute.hyperbolic.ai
  resources:
  - gpuavailabilities/status
  verbs:
  - get
