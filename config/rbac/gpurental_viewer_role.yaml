# This rule is not used by the project hyperbolic-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to hyperbolic.ai resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: hyperbolic-operator
    app.kubernetes.io/managed-by: kustomize
  name: gpurental-viewer-role
rules:
- apiGroups:
  - hyperbolic.ai
  resources:
  - gpurentals
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - hyperbolic.ai
  resources:
  - gpurentals/status
  verbs:
  - get
