---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: sshkeys.compute.hyperbolic.ai
spec:
  group: compute.hyperbolic.ai
  names:
    categories:
    - hyperbolic
    kind: SSHKey
    listKind: SSHKeyList
    plural: sshkeys
    singular: sshkey
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.id
      name: ID
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SSHKey saves an SSH public key on a Hyperbolic account. GPURentals list
          it in spec.sshKeyRefs to authorize it on their rentals. Saving a key makes
          it the account's newest, which the API authorizes by default on rentals
          created without naming keys, including teammates' rentals created in the
          dashboard.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the key to save and the account to save it on.
            properties:
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy decides what deleting this object does to the saved
                  key. Delete (the default) deletes it from the account if the operator
                  saved it, once no live rental uses it. Orphan leaves it saved. A key
                  the account already had is never deleted.
                enum:
                - Delete
                - Orphan
                type: string
              providerConfigRef:
                description: |-
                  ProviderConfigRef selects the account to save the key on: a
                  ProviderConfig in this namespace (the default kind) or a
                  ClusterProviderConfig.
                properties:
                  kind:
                    default: ProviderConfig
                    description: |-
                      kind is ProviderConfig (in the resource's own namespace, the default)
                      or ClusterProviderConfig.
                    enum:
                    - ProviderConfig
                    - ClusterProviderConfig
                    type: string
                  name:
                    description: name of the referenced config.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              publicKey:
                description: |-
                  PublicKey is the key in OpenSSH authorized_keys format, such as the
                  contents of ~/.ssh/id_ed25519.pub: its type, the base64 key and an
                  optional comment. The account holds each key once, whatever its
                  comment. It cannot change. Create a new SSHKey for another key.
                maxLength: 16384
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: publicKey must be one OpenSSH public key line, such as
                    the contents of ~/.ssh/id_ed25519.pub
                  rule: self.matches('^[a-z0-9@.-]+ [A-Za-z0-9+/]+={0,3}( [^\n]*)?\n?$')
                - message: publicKey is immutable. Create a new SSHKey instead
                  rule: self == oldSelf
            required:
            - providerConfigRef
            - publicKey
            type: object
            x-kubernetes-validations:
            - message: providerConfigRef is immutable. Create a new SSHKey instead
              rule: self.providerConfigRef == oldSelf.providerConfigRef
          status:
            description: status is the observed state of the saved key.
            properties:
              conditions:
                description: |-
                  Conditions are Ready (the key is saved and GPURentals can use it, and
                  the reason says whether the operator saved it or adopted it) and
                  Synced (could the last reconcile reach the Hyperbolic API).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              id:
                description: ID is the saved key's id on the account.
                format: int64
                type: integer
              observedGeneration:
                description: ObservedGeneration is the spec generation last processed.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
