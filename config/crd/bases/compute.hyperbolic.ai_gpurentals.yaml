---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: gpurentals.compute.hyperbolic.ai
spec:
  group: compute.hyperbolic.ai
  names:
    categories:
    - hyperbolic
    kind: GPURental
    listKind: GPURentalList
    plural: gpurentals
    shortNames:
    - gpr
    singular: gpurental
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.gpuType
      name: GPU
      type: string
    - jsonPath: .spec.gpuCount
      name: Count
      type: integer
    - jsonPath: .status.region
      name: Region
      type: string
    - jsonPath: .status.costCentsPerHour
      name: Cents/Hr
      type: integer
    - jsonPath: .status.rentalId
      name: Rental-ID
      type: string
    - jsonPath: .status.name
      name: Rental-Name
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GPURental is the Schema for the gpurentals API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired rental.
            properties:
              displayName:
                description: |-
                  DisplayName is the human-readable name shown in the Hyperbolic dashboard.
                  It is sent as the rental's `label`. If unset, no label is sent and the
                  platform's server-generated name (status.name) is the identity. Opt-in
                  only — it is never derived from metadata.name and never used for matching.
                maxLength: 40
                type: string
              gpuCount:
                description: |-
                  GPUCount is the number of GPUs. Values >8 yield a multi-node rental (one
                  rental, several instances) since a node is 8 GPUs.
                format: int32
                minimum: 1
                type: integer
              gpuType:
                description: |-
                  GPUType is the GPU model to rent, as the catalog names it (for example
                  h100, h200, b200 or rtx-6000-pro). It is checked against the account's
                  catalog when the rental is created, so new models work without an
                  operator upgrade. An unknown type leaves the rental Blocked with reason
                  AvailabilityUnavailable.
                maxLength: 63
                pattern: ^[a-z0-9][a-z0-9-]*$
                type: string
              maxPriceCentsPerHour:
                description: |-
                  MaxPriceCentsPerHour refuses to create the rental if the marketplace
                  price for the resolved option exceeds this ceiling. It can be changed at
                  any time, for example to unblock a rental waiting for a cheaper offer.
                format: int64
                minimum: 1
                type: integer
              networkType:
                description: |-
                  NetworkType selects the interconnect fabric. Left unset, the operator
                  picks an available fabric from the marketplace options for the resolved
                  region (so it never fails an availability check by guessing). Set it only
                  to pin a fabric (matters mainly for multi-node clusters).
                enum:
                - ethernet
                - infiniband
                type: string
              ports:
                description: |-
                  Ports is the list of ports to open directly on the instance's public IP
                  (sent as the API's customPorts). Opened as-is (no NAT remapping). Only
                  supported in forge regions, with at most 20 unique ports in 1-65535. Ports cannot be
                  changed after creation. Recreate the GPURental to change them.
                items:
                  format: int32
                  maximum: 65535
                  minimum: 1
                  type: integer
                maxItems: 20
                type: array
                x-kubernetes-list-type: set
              providerConfigRef:
                description: |-
                  ProviderConfigRef selects the ProviderConfig (credential + endpoint) in
                  this namespace to use for the rental.
                properties:
                  name:
                    description: name of the referenced object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              rebootGeneration:
                description: |-
                  RebootGeneration reboots all nodes when its value increases. Leave at 0
                  (or unset) for no reboot.
                format: int32
                type: integer
              region:
                description: |-
                  Region to rent in. If omitted, the operator auto-selects the cheapest
                  region that has availability for (gpuType, gpuCount) — and, when Ports is
                  set, only from regions that support custom ports.
                maxLength: 63
                type: string
              terminated:
                default: false
                description: |-
                  Terminated permanently releases the rental's GPUs while keeping this
                  object as a read-only record. It is a ONE-WAY switch: once true it cannot
                  be set back to false, and the rental is never re-provisioned — create a
                  new GPURental to rent again. (Deleting the object also terminates, via the
                  finalizer, and then removes it.)
                type: boolean
            required:
            - gpuCount
            - gpuType
            - providerConfigRef
            type: object
            x-kubernetes-validations:
            - message: 'spec.terminated is one-way: it cannot be set back to false
                once true (the rental is gone; create a new GPURental to rent again)'
              rule: '!oldSelf.terminated || self.terminated'
            - message: gpuType and gpuCount are immutable. Create a new GPURental
                instead
              rule: self.gpuType == oldSelf.gpuType && self.gpuCount == oldSelf.gpuCount
            - message: region is immutable. Create a new GPURental instead
              rule: has(self.region) == has(oldSelf.region) && (!has(self.region)
                || self.region == oldSelf.region)
            - message: networkType is immutable. Create a new GPURental instead
              rule: has(self.networkType) == has(oldSelf.networkType) && (!has(self.networkType)
                || self.networkType == oldSelf.networkType)
            - message: ports are immutable. Create a new GPURental instead
              rule: has(self.ports) == has(oldSelf.ports) && (!has(self.ports) ||
                self.ports == oldSelf.ports)
            - message: displayName is immutable. Create a new GPURental instead
              rule: has(self.displayName) == has(oldSelf.displayName) && (!has(self.displayName)
                || self.displayName == oldSelf.displayName)
            - message: providerConfigRef is immutable. Create a new GPURental instead
              rule: self.providerConfigRef == oldSelf.providerConfigRef
          status:
            description: status is the observed state of the rental.
            properties:
              conditions:
                description: |-
                  Conditions are Ready (is the rental running, the reason says why not)
                  and Synced (could the last reconcile reach the Hyperbolic API).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              costCentsPerHour:
                description: CostCentsPerHour is the current hourly cost of the rental,
                  in cents.
                format: int64
                type: integer
              instances:
                description: Instances is the per-node SSH/IP/phase view (populated
                  once Running).
                items:
                  description: InstanceStatus is the per-node view of a (possibly
                    multi-node) rental.
                  properties:
                    instanceRef:
                      description: InstanceRef uniquely identifies a node; it is the
                        reboot target.
                      type: string
                    internalIp:
                      description: InternalIP is the node's private-network address.
                      type: string
                    phase:
                      description: Phase is the raw provider phase for this node (e.g.
                        Running, Rebooting).
                      type: string
                    ssh:
                      description: SSH is the connection string, "user@host:port".
                      type: string
                  required:
                  - instanceRef
                  type: object
                type: array
              label:
                description: |-
                  Label is the rental's label (the name shown in the dashboard), as the
                  API reports it.
                type: string
              lastSyncTime:
                description: LastSyncTime is when the operator last reconciled against
                  the API.
                format: date-time
                type: string
              name:
                description: |-
                  Name is the server-generated random 3-word rental name (e.g.
                  "conscious-bougainvillea-oryx"). Read-only; surfaced so a human can map
                  this CR to what the dashboard shows.
                type: string
              networkType:
                description: NetworkType is the rental's interconnect fabric (ethernet
                  or infiniband).
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation last processed.
                format: int64
                type: integer
              openPorts:
                description: OpenPorts echoes the custom ports opened on the instance
                  IP.
                items:
                  format: int32
                  type: integer
                type: array
              phase:
                description: |-
                  Phase summarizes the rental for display: Blocked, Provisioning,
                  Running, Rebooting, Terminating, Terminated, Failed or Unknown.
                  Automation should read the Ready and Synced conditions instead.
                type: string
              region:
                description: Region is the resolved region the rental runs in.
                type: string
              rentalId:
                description: |-
                  RentalID is the server's rental id: the handle terminate and reboot
                  take, and how this rental is found when listing.
                type: string
              terminatedAt:
                description: |-
                  TerminatedAt is when the rental was observed terminated, by the
                  operator (spec.terminated) or externally. Once set, this object is a
                  read-only record and is never provisioned again. Create a new GPURental
                  to rent again.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
