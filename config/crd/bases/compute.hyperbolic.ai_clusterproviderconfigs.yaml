---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: clusterproviderconfigs.compute.hyperbolic.ai
spec:
  group: compute.hyperbolic.ai
  names:
    categories:
    - hyperbolic
    kind: ClusterProviderConfig
    listKind: ClusterProviderConfigList
    plural: clusterproviderconfigs
    shortNames:
    - hcpc
    singular: clusterproviderconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.endpoint
      name: Endpoint
      type: string
    - description: Balance in cents
      jsonPath: .status.balanceCents
      name: Balance
      type: integer
    - description: Hourly cost of the account's active rentals in cents
      jsonPath: .status.costCentsPerHour
      name: Cents/Hr
      type: integer
    - jsonPath: .status.managedRentals
      name: Rentals
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterProviderConfig connects many namespaces to one Hyperbolic account,
          for platform teams that manage one API key centrally. Like cert-manager's
          ClusterIssuer, its credentials Secret lives in the operator's own namespace,
          so creating one never grants access to Secrets anywhere else.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the credential, endpoint and the namespaces allowed
              to use it.
            properties:
              allowedNamespaces:
                description: |-
                  AllowedNamespaces selects, by namespace labels, the namespaces whose
                  GPURentals and GPUAvailabilities may use this config. Omit it to allow
                  every namespace. Select namespaces by name with the
                  kubernetes.io/metadata.name label.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              credentials:
                description: Credentials says where the Hyperbolic API key comes from.
                properties:
                  secretRef:
                    description: |-
                      secretRef selects the Secret key, in this object's namespace, that
                      holds the API key (an sk_live_... token).
                    properties:
                      key:
                        default: api-key
                        description: key within the Secret whose value is the API
                          key.
                        type: string
                      name:
                        description: name of the Secret holding the Hyperbolic API
                          key.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  source:
                    default: Secret
                    description: source of the API key.
                    enum:
                    - Secret
                    type: string
                required:
                - secretRef
                type: object
              endpoint:
                default: https://api.hyperbolic.ai
                description: |-
                  Endpoint is the Hyperbolic API base URL. Defaults to
                  https://api.hyperbolic.ai. It must use https. Plain http is accepted
                  only for loopback test servers, so an API key never crosses a network
                  unencrypted.
                maxLength: 2048
                type: string
                x-kubernetes-validations:
                - message: endpoint must be an https URL. Plain http is allowed only
                    for localhost, 127.0.0.1 or ::1
                  rule: isURL(self) && (url(self).getScheme() == 'https' || (url(self).getScheme()
                    == 'http' && url(self).getHostname() in ['localhost', '127.0.0.1',
                    '::1']))
            required:
            - credentials
            type: object
          status:
            description: status is the observed credential/account state.
            properties:
              activeRentals:
                description: |-
                  ActiveRentals is how many rentals the account has active, including
                  rentals started outside this cluster, as Hyperbolic reports it.
                format: int32
                type: integer
              balanceCents:
                description: BalanceCents is the account balance in cents, from the
                  last check.
                format: int64
                type: integer
              conditions:
                description: |-
                  Conditions are Ready and Authenticated (the API key works) and Synced
                  (the last reconcile could read the key and reach the API).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              costCentsPerHour:
                description: |-
                  CostCentsPerHour is the combined hourly cost of the account's active
                  rentals in cents, as Hyperbolic reports it.
                format: int64
                type: integer
              lastChecked:
                description: |-
                  LastChecked is when the credential, balance and active rentals were last
                  read from the API.
                format: date-time
                type: string
              managedRentals:
                description: |-
                  ManagedRentals is how many GPURentals use this config and have not
                  finished (their rental is not known to be terminated). While it is above
                  zero, deleting the config waits.
                format: int32
                type: integer
              maxOverdraftCents:
                description: MaxOverdraftCents is the account's overdraft allowance
                  in cents.
                format: int64
                type: integer
              observedGeneration:
                description: ObservedGeneration is the spec generation last processed.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
