---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: gpuavailabilities.compute.hyperbolic.ai
spec:
  group: compute.hyperbolic.ai
  names:
    categories:
    - hyperbolic
    kind: GPUAvailability
    listKind: GPUAvailabilityList
    plural: gpuavailabilities
    shortNames:
    - gpa
    singular: gpuavailability
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: gpuType filter (blank = any)
      jsonPath: .spec.gpuType
      name: GPU
      type: string
    - description: region filter (blank = any)
      jsonPath: .spec.region
      name: Region
      type: string
    - jsonPath: .status.offeringCount
      name: Offerings
      type: integer
    - description: Lowest hourly price among matches (cents)
      jsonPath: .status.offerings[0].costCentsPerHour
      name: Cheapest-Cents
      type: integer
    - jsonPath: .status.lastRefreshTime
      name: Refreshed
      type: date
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GPUAvailability is a filtered view of the Hyperbolic GPU marketplace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the catalogue filter.
            properties:
              gpuCount:
                description: GPUCount filters to offerings with exactly this many
                  GPUs.
                format: int32
                minimum: 1
                type: integer
              gpuType:
                description: GPUType filters to one model.
                maxLength: 63
                pattern: ^[a-z0-9][a-z0-9-]*$
                type: string
              maxPriceCentsPerHour:
                description: MaxPriceCentsPerHour keeps only offerings at or below
                  this hourly price.
                format: int64
                minimum: 1
                type: integer
              networkType:
                description: NetworkType filters to one interconnect fabric.
                enum:
                - ethernet
                - infiniband
                type: string
              onlyAvailable:
                default: false
                description: |-
                  OnlyAvailable keeps only offerings that are enabled and have known stock
                  greater than zero (offerings with unknown stock are excluded when true).
                type: boolean
              providerConfigRef:
                description: |-
                  ProviderConfigRef selects the ProviderConfig (credential + endpoint) in
                  this namespace whose account catalogue to show.
                properties:
                  name:
                    description: name of the referenced object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              region:
                description: Region filters to one region.
                type: string
            required:
            - providerConfigRef
            type: object
          status:
            description: status is the filtered catalogue view.
            properties:
              conditions:
                description: |-
                  Conditions are Ready (offerings are populated) and Synced (the last
                  catalog fetch succeeded, and False means the offerings may be stale).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastRefreshTime:
                description: LastRefreshTime is when the shared catalogue cache was
                  last refreshed.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation last processed.
                format: int64
                type: integer
              offeringCount:
                description: OfferingCount is len(offerings).
                format: int32
                type: integer
              offerings:
                description: Offerings matching the spec filter, cheapest first.
                items:
                  description: Offering is a single matched marketplace option.
                  properties:
                    available:
                      description: |-
                        Available is the known in-stock count. Nil means the provider did not
                        report stock (unknown), which is distinct from zero.
                      format: int32
                      type: integer
                    costCentsPerHour:
                      description: CostCentsPerHour is the hourly price in cents.
                      format: int64
                      type: integer
                    enabled:
                      description: Enabled is whether the offering is currently orderable.
                      type: boolean
                    ethernetVariant:
                      description: EthernetVariant is normal|rocev2 for ethernet offerings,
                        when known.
                      type: string
                    gpuCount:
                      format: int32
                      type: integer
                    gpuType:
                      type: string
                    networkType:
                      description: NetworkType is the interconnect fabric (ethernet|infiniband).
                      type: string
                    region:
                      type: string
                  required:
                  - costCentsPerHour
                  - enabled
                  - gpuCount
                  - gpuType
                  - region
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
