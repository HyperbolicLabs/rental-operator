{{- $name := include "hyperbolic-operator.fullname" . -}}
{{- $sa := include "hyperbolic-operator.serviceAccountName" . -}}
---
# Core permissions: the CRDs + the Secrets holding API keys. The operator
# watches all namespaces, so these are cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "hyperbolic-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [hyperbolic.ai]
    resources: [gpurentals, providerconfigs, gpuavailabilities]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [hyperbolic.ai]
    resources: [gpurentals/finalizers, providerconfigs/finalizers]
    verbs: [update]
  - apiGroups: [hyperbolic.ai]
    resources: [gpurentals/status, providerconfigs/status, gpuavailabilities/status]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "hyperbolic-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
---
# Leader election + events, in the namespace the operator runs in.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperbolic-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperbolic-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
