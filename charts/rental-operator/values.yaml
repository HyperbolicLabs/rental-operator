# Default values for rental-operator.

image:
  repository: ghcr.io/hyperboliclabs/rental-operator
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

# Namespaces the operator watches. Empty (the default) watches every namespace
# and grants the operator a ClusterRole, which lets it read Secrets in any
# namespace. Listing namespaces installs a Role in each of them instead, so the
# operator cannot read Secrets anywhere else: the least-privilege option.
#   watchNamespaces: [ml-team, research]
watchNamespaces: []

# Leader election lets you run more than one replica safely.
leaderElection:
  enabled: true

serviceAccount:
  create: true
  name: ""           # defaults to the fullname
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Probe port (matches the manager's --health-probe-bind-address).
healthProbePort: 8081

# Prometheus metrics and alerts. docs/observability.md lists every metric and
# alert, and how to scrape them.
metrics:
  # Serve metrics through a Service named <fullname>-metrics.
  enabled: false
  port: 8443
  # Serve HTTPS and answer only requests whose bearer token may GET /metrics:
  # bind the <fullname>-metrics-reader ClusterRole to your Prometheus service
  # account. false serves plain HTTP to anyone who can reach the pod.
  secure: true
  # A ServiceMonitor for the Prometheus Operator (needs its CRDs).
  serviceMonitor:
    enabled: false
    interval: 60s
    # Labels your Prometheus selects ServiceMonitors by, for example
    # release: kube-prometheus-stack.
    labels: {}
  # The alert rules in files/alerts.yaml as a PrometheusRule (needs the
  # Prometheus Operator CRDs).
  prometheusRule:
    enabled: false
    labels: {}

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
