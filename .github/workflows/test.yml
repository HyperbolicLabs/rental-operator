name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    env:
      # hyperbolic-go is private for now. See CONTRIBUTING.md.
      GOPRIVATE: github.com/HyperbolicLabs/*
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Allow access to private HyperbolicLabs modules
        env:
          TOKEN: ${{ secrets.HYPERBOLIC_GO_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/HyperbolicLabs/".insteadOf "https://github.com/HyperbolicLabs/"

      - name: Running Tests
        run: |
          go mod tidy
          make test
