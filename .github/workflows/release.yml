name: Release

# Runs only when a GitHub Release is published. Ordinary merges/pushes to main
# run the lint/test workflows, never this one — so nothing ships until you cut a
# Release with a semver tag (e.g. v0.1.0).
on:
  release:
    types: [published]

permissions:
  contents: write # attach the packaged chart to the Release
  packages: write # push image + chart to GHCR

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version and names
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"          # the Release tag, e.g. v0.1.0
          VER="${TAG#v}"                    # strip the leading v -> 0.1.0
          if ! echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+].*)?$'; then
            echo "::error::Release tag '$TAG' is not semver (expected vX.Y.Z)"; exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "charts_repo=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (linux/amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Package chart at the release version
        run: |
          mkdir -p dist
          helm package charts/rental-operator \
            --version "${{ steps.meta.outputs.version }}" \
            --app-version "${{ steps.meta.outputs.version }}" \
            --destination dist

      - name: Push chart to GHCR (OCI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/rental-operator-${{ steps.meta.outputs.version }}.tgz" "${{ steps.meta.outputs.charts_repo }}"

      - name: Attach the packaged chart to the Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rental-operator-${{ steps.meta.outputs.version }}.tgz
