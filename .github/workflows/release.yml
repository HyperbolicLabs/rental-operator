name: Release

# Releases the commit of main this workflow runs on. It checks that CI passed
# on the commit and chooses the version (hack/release-version.sh). After an
# owner approves, it builds, signs and publishes the image and the chart, and
# only then creates the tag and the GitHub Release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Leave empty to release the suggested version, or enter a pre-release of it (v0.3.0-rc.1) or a larger version (v1.0.0).
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release

jobs:
  prepare:
    name: Check the commit and choose the version
    runs-on: ubuntu-latest
    permissions:
      actions: read # read CI's results for the commit
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Release only from main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are cut from main, not $GITHUB_REF."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and pull request titles since the last release

      - name: Require CI to have passed on the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in lint.yml test.yml verify.yml test-e2e.yml; do
            conclusion=$(gh run list --workflow "$workflow" --commit "$GITHUB_SHA" --event push --limit 1 --json conclusion --jq '.[0].conclusion // ""')
            if [ "$conclusion" != success ]; then
              echo "::error::$workflow has not passed on $GITHUB_SHA (result: ${conclusion:-no finished run}). Wait for it, or fix main first."
              exit 1
            fi
          done

      - name: Choose the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version=$(hack/release-version.sh "$REQUESTED")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish ${{ needs.prepare.outputs.version }}
    needs: prepare
    runs-on: ubuntu-latest
    # Owners approve each run (Settings > Environments > release).
    environment: release
    permissions:
      contents: write # create the tag and the release
      packages: write # push the image and the chart to GHCR
      id-token: write # keyless cosign signatures (GitHub OIDC)
    env:
      TAG: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute names
        id: meta
        run: |
          {
            echo "version=${TAG#v}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "charts_repo=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
            if [[ $TAG == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image (linux/amd64 and linux/arm64)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # BuildKit attaches an SPDX SBOM and SLSA provenance to the image.
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          # hyperbolic-go is private for now, and the Dockerfile reads this secret only to download modules.
          secrets: |
            gh_token=${{ secrets.HYPERBOLIC_GO_READ_TOKEN }}
          # A pre-release never moves :latest.
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.prerelease == 'false' && format('{0}:latest', steps.meta.outputs.image) || '' }}

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign the image (keyless)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: v3.22.1

      - name: Package the chart at the release version
        run: |
          mkdir -p dist
          helm package charts/rental-operator \
            --version "${{ steps.meta.outputs.version }}" \
            --app-version "${{ steps.meta.outputs.version }}" \
            --destination dist

      - name: Push the chart to GHCR (OCI)
        id: chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/rental-operator-${{ steps.meta.outputs.version }}.tgz" "${{ steps.meta.outputs.charts_repo }}" 2>&1 | tee push.log
          digest=$(awk '/^Digest:/ {print $2}' push.log)
          test -n "$digest" || { echo "::error::helm push printed no digest"; exit 1; }
          echo "chart=${{ steps.meta.outputs.charts_repo }}/rental-operator@${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign the chart (keyless)
        env:
          CHART: ${{ steps.chart.outputs.chart }}
        run: cosign sign --yes "${CHART#oci://}"

      # Artifact Hub reads this file to list the chart under a verified
      # publisher. It is published once ARTIFACTHUB_REPOSITORY_ID is set to the
      # chart's Artifact Hub repository ID (Settings > Variables > Actions).
      - name: Install oras
        if: vars.ARTIFACTHUB_REPOSITORY_ID != ''
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish the Artifact Hub metadata
        if: vars.ARTIFACTHUB_REPOSITORY_ID != ''
        env:
          REPOSITORY_ID: ${{ vars.ARTIFACTHUB_REPOSITORY_ID }}
          CHARTS_REPO: ${{ steps.meta.outputs.charts_repo }}
        run: |
          printf 'repositoryID: %s\n' "$REPOSITORY_ID" > artifacthub-repo.yml
          oras push "${CHARTS_REPO#oci://}/rental-operator:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          CHART_FILE: dist/rental-operator-${{ steps.meta.outputs.version }}.tgz
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "$CHART_FILE" --target "$GITHUB_SHA" --title "$TAG" --generate-notes "${flags[@]}"
