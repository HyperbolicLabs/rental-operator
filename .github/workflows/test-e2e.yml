name: E2E Tests

on:
  push:
  pull_request:

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    env:
      # hyperbolic-go is private for now. See CONTRIBUTING.md.
      GOPRIVATE: github.com/HyperbolicLabs/*
      HYPERBOLIC_GO_TOKEN: ${{ secrets.HYPERBOLIC_GO_READ_TOKEN }}
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Allow access to private HyperbolicLabs modules
        env:
          TOKEN: ${{ secrets.HYPERBOLIC_GO_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/HyperbolicLabs/".insteadOf "https://github.com/HyperbolicLabs/"

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e
