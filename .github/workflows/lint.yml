name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    env:
      # hyperbolic-go is private for now. See CONTRIBUTING.md.
      GOPRIVATE: github.com/HyperbolicLabs/*
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Allow access to private HyperbolicLabs modules
        env:
          TOKEN: ${{ secrets.HYPERBOLIC_GO_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/HyperbolicLabs/".insteadOf "https://github.com/HyperbolicLabs/"

      - name: Run linter
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          # renovate: datasource=go depName=github.com/golangci/golangci-lint/v2
          version: v2.15.0
