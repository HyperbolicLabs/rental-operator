name: Verify

on:
  push:
  pull_request:

jobs:
  generated:
    name: Generated files are current
    runs-on: ubuntu-latest
    env:
      # hyperbolic-go is private for now. See CONTRIBUTING.md.
      GOPRIVATE: github.com/HyperbolicLabs/*
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Allow access to private HyperbolicLabs modules
        env:
          TOKEN: ${{ secrets.HYPERBOLIC_GO_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/HyperbolicLabs/".insteadOf "https://github.com/HyperbolicLabs/"

      - name: Regenerate and compare
        run: make verify

  chart:
    name: Helm chart lints and renders
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Lint and render the chart
        run: make helm-lint

  vulncheck:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    env:
      # hyperbolic-go is private for now. See CONTRIBUTING.md.
      GOPRIVATE: github.com/HyperbolicLabs/*
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Allow access to private HyperbolicLabs modules
        env:
          TOKEN: ${{ secrets.HYPERBOLIC_GO_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/HyperbolicLabs/".insteadOf "https://github.com/HyperbolicLabs/"

      - name: Run govulncheck
        run: make vulncheck
